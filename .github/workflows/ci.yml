name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  tree-sitter-test:
    name: tree-sitter test (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g tree-sitter-cli@0.25.10
      - run: make test

  dm-test-suite:
    name: Parse spacestation13/dm-test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g tree-sitter-cli@0.25.10

      - name: Clone dm-test-suite
        uses: actions/checkout@v6
        with:
          repository: spacestation13/dm-test-suite
          path: dm-test-suite

      - name: Parse every .dm file
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          total=0
          while IFS= read -r -d '' f; do
            total=$((total+1))
            if ! tree-sitter parse --quiet "$f" >/dev/null 2>&1; then
              echo "::error file=$f::tree-sitter parse failed"
              fail=$((fail+1))
            fi
          done < <(find dm-test-suite -name '*.dm' -print0)
          echo ""
          echo "Parsed $total files in dm-test-suite; $fail failed"
          [ "$fail" -eq 0 ]
